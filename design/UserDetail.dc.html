<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>かずメモ ユーザー詳細</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D211C}a:hover{color:#000}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F4EF; color: #1D211C; font-family: 'M PLUS Rounded 1c', system-ui, sans-serif; overflow: hidden">
  <header style="padding: 16px 12px 4px; display: grid; grid-template-columns: 48px 1fr 48px; align-items: center">
    <a href="Users.dc.html" aria-label="戻る" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #1D211C">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 17px; font-weight: 800; text-align: center">ユーザー詳細</h1>
    <button aria-label="ユーザーを編集" style="width: 44px; height: 44px; border: none; background: transparent; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #1D211C; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg>
    </button>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 8px 16px 32px; display: flex; flex-direction: column; gap: 16px">
    <section style="display: flex; align-items: center; gap: 16px; padding: 4px 4px 8px">
      <span style="width: 72px; height: 72px; border-radius: 999px; background: {{color}}; color: #FFFFFF; font-size: 28px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">妻</span>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 24px; font-weight: 800">妻</span>
        <span style="font-size: 13px; color: #5B6158">4つの項目をカウント中</span>
      </div>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E2E4DC; border-radius: 20px; padding: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; font-weight: 700; color: #5B6158">2026年10月の合計</span>
        <span style="display: flex; align-items: baseline; gap: 4px"><b style="font-size: 36px; font-weight: 800; line-height: 1">53</b><span style="font-size: 14px; color: #5B6158">回</span></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; border-left: 1px solid #E2E4DC; padding-left: 16px">
        <span style="font-size: 12px; font-weight: 700; color: #5B6158">先月との差</span>
        <span style="display: flex; align-items: baseline; gap: 4px"><b style="font-size: 36px; font-weight: 800; line-height: 1">+6</b><span style="font-size: 14px; color: #5B6158">回</span></span>
      </div>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E2E4DC; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 style="margin: 0; font-size: 15px; font-weight: 800">項目別のカウント</h2>
        <div role="tablist" aria-label="期間" style="display: flex; background: #F3F4EF; border-radius: 999px; padding: 3px">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
            <button role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="height: 30px; padding: 0 12px; border: none; border-radius: 999px; font-size: 12px; font-weight: 800; cursor: pointer; background: {{t.bg}}; color: {{t.fg}}">{{t.label}}</button>
          </sc-for>
        </div>
      </div>
      <div role="img" aria-label="{{itemsAria}}" style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
          <div style="display: grid; grid-template-columns: 76px 1fr 40px; align-items: center; gap: 10px">
            <span style="font-size: 13px; font-weight: 700">{{it.name}}</span>
            <span style="height: 22px; background: #F0F1EC; border-radius: 6px; overflow: hidden; display: block">
              <span style="display: block; height: 100%; border-radius: 6px; width: {{it.pct}}%; background: {{color}}"></span>
            </span>
            <span style="font-size: 15px; font-weight: 800; text-align: right">{{it.value}}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E2E4DC; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 800">月ごとの合計</h2>
      <div role="img" aria-label="{{trendAria}}" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; align-items: end; height: 170px; border-bottom: 1px solid #D5D8CE">
        <sc-for list="{{trend}}" as="m" hint-placeholder-count="6">
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%">
            <span style="font-size: 12px; font-weight: 800; color: {{m.labelColor}}">{{m.value}}</span>
            <span style="display: block; width: 100%; max-width: 32px; border-radius: 8px 8px 0 0; height: {{m.h}}px; background: {{m.fill}}"></span>
          </div>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-top: -6px">
        <sc-for list="{{trend}}" as="m" hint-placeholder-count="6">
          <span style="font-size: 11px; font-weight: 700; color: #5B6158; text-align: center">{{m.label}}</span>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var DATA = {
  month: [ { name: '朝食準備', value: 22 }, { name: '洗濯', value: 14 }, { name: '皿洗い', value: 12 }, { name: '掃除', value: 5 } ],
  prev:  [ { name: '朝食準備', value: 20 }, { name: '洗濯', value: 12 }, { name: '皿洗い', value: 9 },  { name: '掃除', value: 6 } ]
};
var TREND = [ ['5月', 44], ['6月', 49], ['7月', 47], ['8月', 51], ['9月', 47], ['10月', 53] ];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'month' }; }
  renderVals() {
    var self = this;
    var color = '#B8551C';
    var list = DATA[this.state.tab];
    var max = Math.max.apply(null, list.map(function (x) { return x.value; }));
    var tmax = 60;
    return {
      color: color,
      tabs: [ { id: 'month', label: '今月' }, { id: 'prev', label: '先月' } ].map(function (t) {
        var on = t.id === self.state.tab;
        return { label: t.label, sel: on ? 'true' : 'false', bg: on ? '#1D211C' : 'transparent', fg: on ? '#FFFFFF' : '#5B6158', pick: function () { self.setState({ tab: t.id }); } };
      }),
      items: list.map(function (x) { return { name: x.name, value: x.value, pct: Math.round(x.value / max * 100) }; }),
      itemsAria: '項目別のカウント：' + list.map(function (x) { return x.name + ' ' + x.value + '回'; }).join('、'),
      trend: TREND.map(function (t, i) {
        var last = i === TREND.length - 1;
        return { label: t[0], value: t[1], h: Math.round(t[1] / tmax * 130), fill: last ? color : '#E8C6B1', labelColor: last ? '#1D211C' : '#5B6158' };
      }),
      trendAria: '月ごとの合計：' + TREND.map(function (t) { return t[0] + ' ' + t[1] + '回'; }).join('、')
    };
  }
}
</script>
</body>
</html>
